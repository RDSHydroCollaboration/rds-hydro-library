<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RDS Hydro Library</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-table" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16"/></symbol>
    <symbol id="i-map" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="6" height="6" rx="1.5"/><rect x="15" y="3" width="6" height="5" rx="1.5"/><rect x="15" y="16" width="6" height="5" rx="1.5"/><path d="M9 12h3V5.5h3M12 12v7.5h3"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 7 5 5 5-5M7 13l5 5 5-5"/></symbol>
    <symbol id="i-collapse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 11 5-5 5 5M7 17l5-5 5 5"/></symbol>
    <symbol id="i-csv" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></symbol>
    <symbol id="i-xlsx" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></symbol>
    <symbol id="i-json" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4c-2 0-3 1-3 3v2c0 1.5-1 3-2 3 1 0 2 1.500 2 3v2c0 2 1 3 3 3M16 4c2 0 3 1 3 3v2c0 1.500 1 3 2 3-1 0-2 1.500-2 3v2c0 2-1 3-3 3"/></symbol>
  </defs>
</svg>
<header>
  <h1 id="title">RDS Hydro Library</h1>
  <nav class="tabs" id="tabs">
    <button data-t="types" id="tab-types"><svg class="ic"><use href="#i-table"/></svg><span class="l"></span></button>
    <button data-t="map" id="tab-map"><svg class="ic"><use href="#i-map"/></svg><span class="l"></span></button>
  </nav>
  <div class="right"><div class="seg" id="lang"><button data-l="no">NO</button><button data-l="en">EN</button></div></div>
</header>
<main>
  <section id="types">
    <div class="tools">
      <input id="q" type="search">
      <button id="tx-expand"><svg class="ic"><use href="#i-expand"/></svg><span class="l"></span></button><button id="tx-collapse"><svg class="ic"><use href="#i-collapse"/></svg><span class="l"></span></button>
      <span id="filters"></span>
      <span class="dl"><label id="dl-lang-label"></label>
        <select id="dl-lang"><option value="no">NO</option><option value="en">EN</option><option value="both"></option></select>
        <button data-f="csv"><svg class="ic"><use href="#i-csv"/></svg>CSV</button><button data-f="xlsx"><svg class="ic"><use href="#i-xlsx"/></svg>XLSX</button><button data-f="json"><svg class="ic"><use href="#i-json"/></svg>JSON</button></span>
    </div>
    <table id="table"><thead></thead><tbody></tbody></table>
  </section>
  <section id="map" hidden>
    <div class="tools">
      <button id="expand"><svg class="ic"><use href="#i-expand"/></svg><span class="l"></span></button><button id="collapse"><svg class="ic"><use href="#i-collapse"/></svg><span class="l"></span></button>
      <span class="dl"><label id="dl-lang-label2"></label>
        <button data-f="tcsv"><svg class="ic"><use href="#i-csv"/></svg>CSV</button><button data-f="txlsx"><svg class="ic"><use href="#i-xlsx"/></svg>XLSX</button><button data-f="tjson"><svg class="ic"><use href="#i-json"/></svg>JSON</button></span>
    </div>
    <div class="split"><div id="mm" class="mm"></div><aside id="info" class="info"></aside></div>
  </section>
</main>
<footer id="foot"></footer>
<script src="vendor/xlsx.full.min.js"></script>
<script src="app.js"></script>
<script src="edit.js"></script>
</body>
</html>
